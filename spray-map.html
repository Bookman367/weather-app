<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080f1e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hero">
  <title>Hero Weather — Spray Conditions Map</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green:        #3ddc84;
      --yellow:       #ffc107;
      --red:          #ff4d4d;
      --glass-bg:     rgba(15,25,45,0.85);
      --glass-border: rgba(255,255,255,0.18);
      --blur:         blur(10px);
      --text:         #ffffff;
      --text-dim:     rgba(255,255,255,0.82);
      --text-muted:   rgba(255,255,255,0.68);
      --radius-pill:  50px;
      --tap:          44px;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      color: var(--text);
      height: 100%;
      overflow: hidden;
      background: #080f1e;
      color-scheme: dark;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    /* Header */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: calc(60px + env(safe-area-inset-top, 0px));
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-bottom: 1px solid var(--glass-border);
    }

    .header-title {
      font-weight: 700; font-size: 15px;
      flex: 1; min-width: 0;
      text-align: center;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 8px;
      padding: 8px 12px;
      min-height: var(--tap);
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .btn:active { background: rgba(255,255,255,0.2); }

    /* Map Container */
    #map {
      position: absolute;
      top: calc(60px + env(safe-area-inset-top, 0px));
      bottom: 270px;
      left: 0;
      right: 0;
      z-index: 1;
    }

    /* Loading overlay */
    #loading {
      position: absolute;
      top: calc(60px + env(safe-area-inset-top, 0px)); bottom: 270px; left: 0; right: 0;
      z-index: 1001;
      background: rgba(8, 15, 30, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      display: none;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Controls Panel */
    .controls-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: auto;
      min-height: 220px;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-top: 1px solid var(--glass-border);
      padding: 10px max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 0;
    }

    .selector {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 10px;
      min-height: var(--tap);
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }
    .selector option { background: #1a2535; }

    /* Timeline */
    .timeline-container {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .play-btn {
      width: var(--tap); height: var(--tap); min-width: var(--tap);
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .play-btn:active { background: rgba(255,255,255,0.25); }

    .slider-container {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .time-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 6px;
      text-align: center;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px; width: 20px;
      border-radius: 50%;
      background: white;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 4px;
      cursor: pointer;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
    }

    /* Map Popup Customization */
    .leaflet-popup-content-wrapper {
      background: rgba(15,25,45,0.95);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
    }
    .leaflet-popup-tip { background: rgba(15,25,45,0.95); }
    .popup-content { font-size: 13px; line-height: 1.4; }
    .popup-title { font-weight: bold; font-size: 15px; margin-bottom: 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .popup-status { font-weight: bold; margin-bottom: 4px; }
    .status-favorable { color: var(--green); }
    .status-caution { color: var(--yellow); }
    .status-no-good { color: var(--red); }

    .dt-optimal { color: var(--green); }
    .dt-caution { color: var(--yellow); }
    .dt-bad { color: var(--red); }
    .dt-unknown { color: var(--text-muted); }
    .dt-line { font-weight: 600; }

    .wind-dir-arrow {
      display: inline-block;
      font-size: 13px;
      line-height: 1;
      transform-origin: center;
    }
    .wind-line { font-weight: 600; }
    .drift-over { color: var(--red); }
    .drift-watch { color: var(--yellow); }
    .drift-ok { color: var(--text-dim); }
    .drift-unknown { color: var(--text-muted); }
    .sun-line { color: var(--text-dim); }

    .spray-segment.night .spray-block::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(8, 15, 30, 0.42);
      border-radius: 6px;
      pointer-events: none;
    }
    .spray-block .sun-mark {
      position: absolute;
      bottom: 1px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 9px;
      line-height: 1;
      pointer-events: none;
      z-index: 1;
    }
    .spray-segment.sunrise-hour .sun-mark { color: #ffd54a; }
    .spray-segment.sunset-hour .sun-mark { color: #c5cae9; }
    .daily-sun {
      font-size: 9px;
      line-height: 1.15;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
    }

    .fields-panel {
      position: absolute;
      top: calc(68px + env(safe-area-inset-top, 0px));
      right: max(10px, env(safe-area-inset-right, 0px));
      left: max(10px, env(safe-area-inset-left, 0px));
      max-width: 360px;
      margin-left: auto;
      z-index: 1100;
      background: var(--glass-bg);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .fields-panel[hidden] { display: none; }
    .fields-panel-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .fields-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.35;
    }
    .fields-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .fields-actions .btn,
    .fields-panel .btn { font-size: 13px; }
    .fields-panel .selector { width: 100%; }

    /* Legend */
    .legend {
      position: absolute;
      top: calc(70px + env(safe-area-inset-top, 0px));
      right: max(10px, env(safe-area-inset-right, 0px));
      z-index: 1000;
      background: rgba(15,25,45,0.85);
      backdrop-filter: var(--blur);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15);
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-color { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.5); }


    /* ── SPRAY WINDOW ─────────────────────────────────────── */
    .spray-window { padding: 0; margin-bottom: 0; flex: 1; min-width: 0; overflow: hidden; }
    .sw-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sw-title  { font-size: 13px; font-weight: 700; letter-spacing: 0.3px; }
    .sw-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .sw-tabs   { display: flex; gap: 6px; }
    .sw-tab {
      background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-pill); color: var(--text-dim);
      cursor: pointer; font-size: 13px; font-weight: 600; padding: 10px 14px; min-height: var(--tap); transition: all 0.2s;
    }
    .sw-tab.active { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); color: var(--text); }

    .selection-details {
      font-size: 12px;
      color: var(--text-dim);
      line-height: 1.35;
      min-height: 30px;
      max-height: 72px;
      overflow-y: auto;
      padding: 0 2px;
    }
    .selection-details strong { color: var(--text); }

    .spray-gradient-bar { height: 6px; border-radius: 3px; margin: 4px 0 12px; }

    .spray-bar-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 2px; padding-bottom: 4px; scroll-snap-type: x proximity; }
    .spray-bar-track { display: flex; gap: 3px; min-width: max-content; }
    .spray-segment { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; width: 36px; }
    .spray-block {
      border-radius: 6px; height: 40px; width: 100%;
      transition: transform 0.15s; cursor: pointer; position: relative;
    }
    .spray-block:hover { transform: scaleY(1.15); }
    .spray-block.favorable { background: linear-gradient(180deg,#3ddc84,#26a85f); box-shadow: 0 2px 8px rgba(61,220,132,0.35); }
    .spray-block.caution   { background: linear-gradient(180deg,#ffc107,#e09000); box-shadow: 0 2px 8px rgba(255,193,7,0.35); }
    .spray-block.no-good   { background: linear-gradient(180deg,#ff4d4d,#cc2222); box-shadow: 0 2px 8px rgba(255,77,77,0.35); }

    /* Scroll-sync active segment highlight */
    .spray-segment.active-segment .spray-block {
      transform: scaleY(1.2);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.7), 0 4px 16px rgba(0,0,0,0.4);
    }
    .spray-segment.active-segment .spray-time {
      color: var(--text) !important;
      font-weight: 700;
    }
    .spray-time { font-size: 13px; color: var(--text-muted); text-align: center; white-space: nowrap; font-weight: 600; }
    .spray-time.bold { color: var(--text-dim); font-weight: 600; }


    .midnight-divider {
      width: 2px;
      height: 40px;
      background-color: var(--text-muted);
      margin: 0 10px;
      flex-shrink: 0;
    }

    .day-label {
      font-size: 12px;
      color: var(--text-dim);
      font-weight: bold;
      margin: 0 10px 0 5px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      scroll-snap-align: start;
    }

    .spray-segment.daily-segment {
      width: 56px;
      scroll-snap-align: start;
    }
    .spray-segment.daily-segment .spray-block { height: 44px; }
    .spray-segment.daily-segment .spray-time { font-size: 11px; }
    .spray-segment.daily-segment.lower-confidence .spray-block {
      opacity: 0.62;
      background-image: repeating-linear-gradient(
        135deg,
        rgba(8, 15, 30, 0.28) 0 3px,
        transparent 3px 7px
      );
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .spray-segment.daily-segment.lower-confidence .spray-time { color: var(--text-muted); }
    .trend-mark {
      font-size: 9px;
      letter-spacing: 0.02em;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .confidence-break {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 18px;
      margin: 0 4px;
      color: var(--text-muted);
      font-size: 9px;
      font-weight: 700;
      text-align: center;
      line-height: 1.15;
      border-left: 2px dashed rgba(255,255,255,0.35);
      padding-left: 4px;
    }

    /* Search Here button inside popups */
    .search-here-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.3);
      color: white;
      padding: 10px 12px;
      min-height: var(--tap);
      border-radius: 12px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .search-here-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    /* Smooth map color transitions */
    .leaflet-interactive {
      transition: fill 0.3s ease-in-out, stroke 0.3s ease-in-out;
    }
</style>
</head>
<body>

  <header>
    <a href="/index.html" class="btn">← Back</a>
    <div class="header-title">Spray Conditions Map</div>
    <button type="button" id="fields-toggle" class="btn">Fields</button>
  </header>

  <div id="fields-panel" class="fields-panel" hidden>
    <div class="fields-panel-title">Saved fields</div>
    <div class="fields-hint">Stored on this phone only. Pick one to center the map and load its forecast.</div>
    <select id="field-select" class="selector" aria-label="Saved fields">
      <option value="">No saved field</option>
    </select>
    <div class="fields-actions">
      <button type="button" id="field-rename-btn" class="btn">Rename</button>
      <button type="button" id="field-delete-btn" class="btn">Delete</button>
    </div>
    <div class="fields-panel-title">Save this map location</div>
    <input id="field-name-input" class="selector" type="text" placeholder="Field name" maxlength="60" autocomplete="off">
    <input id="field-acres-input" class="selector" type="number" inputmode="decimal" min="0" step="0.1" placeholder="Acres (optional)">
    <button type="button" id="field-save-btn" class="btn">Save field</button>
  </div>

  <div id="map"></div>
  <div id="loading">
    <div class="spinner"></div>
    <div style="color:rgba(255,255,255,0.7);font-size:14px">Loading map data...</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-color" style="background: rgba(61,220,132,0.4)"></div> Go</div>
    <div class="legend-item"><div class="legend-color" style="background: rgba(255,193,7,0.4)"></div> Caution</div>
    <div class="legend-item"><div class="legend-color" style="background: rgba(255,77,77,0.4)"></div> No-Go</div>
  </div>

  <div class="controls-panel">
    <div class="controls-row" style="margin-bottom: 10px;">
      <input type="text" id="location-search-input" class="selector" style="flex: 1; margin-right: 10px;" placeholder="Search location, zip, or coordinates">
      <button id="location-search-btn" class="play-btn" style="width: auto; min-width: 72px; padding: 0 15px; font-size: 16px;">Search</button>
    </div>
    <div class="controls-row">
      <select id="product-select" class="selector">
        <option value="general">General Ag</option>
        <option value="2,4-D Amine">2,4-D Amine</option>
        <option value="Dicamba">Dicamba</option>
        <option value="Roundup">Roundup (Glyphosate)</option>
      </select>
      <div class="sw-tabs" id="view-tabs" role="tablist" aria-label="Timeline view">
        <button type="button" class="sw-tab active" data-view="hourly">Hourly</button>
        <button type="button" class="sw-tab" data-view="daily">Daily</button>
      </div>
    </div>
    <div class="sw-subtitle" id="view-legend">Hourly: each block is 1 hour across 7 days. Scroll sideways — play and 2x still work.</div>

    <div class="timeline-container">
      <button id="play-pause" class="play-btn">▶</button>
      <select id="playback-speed" class="selector" style="width: auto; font-size: 14px; padding: 8px;">
        <option value="2000">0.5x</option>
        <option value="1000" selected>1x</option>
        <option value="667">1.5x</option>
        <option value="500">2x</option>
      </select>

      <div class="spray-window">
        <div class="spray-bar-wrap" id="spray-bar-wrap">
          <div class="spray-bar-track" id="spray-bar-track">
            <!-- Timeline elements injected here -->
          </div>
        </div>
      </div>
    </div>
    <div id="selection-details" class="selection-details"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/lib/saved-fields.js"></script>
  <script src="/lib/sun-times.js"></script>
  <script src="/lib/wind-display.js"></script>
  <script src="/lib/url-location.js"></script>

  <script>
    // Initialize map
    const map = L.map('map', {
      zoomControl: false // move to bottom right or custom if needed
    });

    // Move zoom control
    L.control.zoom({ position: 'topright' }).addTo(map);

    // Dark theme map tiles (CartoDB Dark Matter)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    let currentLat = 42.35;
    let currentLon = -97.79;

    // Set initial view
    map.setView([currentLat, currentLon], 9);
    let centerMarker = L.marker([currentLat, currentLon]).addTo(map);

    // Allow clicking anywhere on the map to trigger a search popup
    map.on('click', (e) => {
      const lat = e.latlng.lat.toFixed(4);
      const lon = e.latlng.lng.toFixed(4);

      const popupContent = `
        <div class="popup-content" style="text-align: center; padding: 5px;">
          <div style="font-size: 12px; margin-bottom: 8px; color: var(--text-dim);">${lat}, ${lon}</div>
          <button class="search-here-btn" onclick="searchAtLocation(${lat}, ${lon})">Search Here</button>
        </div>
      `;

      L.popup()
        .setLatLng(e.latlng)
        .setContent(popupContent)
        .openOn(map);
    });


    let gridData = null;
    let currentHourIndex = 0;
    let currentDayIndex = 0;
    let viewMode = 'hourly';
    let rectangles = [];

    const productSelect = document.getElementById('product-select');
    const loadingEl = document.getElementById('loading');
    const viewTabs = document.getElementById('view-tabs');
    const viewLegend = document.getElementById('view-legend');
    const selectionDetails = document.getElementById('selection-details');

    const VIEW_LEGENDS = {
      hourly: 'Hourly: each block is 1 hour across 7 days. Night hours are shaded; ☀/☾ mark sunrise and sunset at this spot.',
      daily: 'Daily: 16 days. Sunrise/sunset are local to the selected spot. First 7 use the usual majority-of-daytime-hours rule. Hatched days after that are trend guidance, not a reliable go/no-go.'
    };



    function fieldsReady() {
      return typeof SavedFields !== 'undefined';
    }

    function fieldsStorage() {
      try { return window.localStorage; } catch (e) {
        return fieldsReady() ? SavedFields.memoryStorage() : { getItem(){ return null; }, setItem(){}, removeItem(){} };
      }
    }

    function loadFieldsDoc() {
      return fieldsReady() ? SavedFields.loadStore(fieldsStorage()) : { fields: [], activeId: null };
    }

    const fieldsToggle = document.getElementById('fields-toggle');
    const fieldsPanel = document.getElementById('fields-panel');
    const fieldSelect = document.getElementById('field-select');
    const fieldNameInput = document.getElementById('field-name-input');
    const fieldAcresInput = document.getElementById('field-acres-input');
    const fieldSaveBtn = document.getElementById('field-save-btn');
    const fieldRenameBtn = document.getElementById('field-rename-btn');
    const fieldDeleteBtn = document.getElementById('field-delete-btn');

    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function fieldButtonLabel(field) {
      if (!field) return 'Fields';
      return field.name.length > 14 ? field.name.slice(0, 13) + '…' : field.name;
    }

    function refreshFieldsUi() {
      if (!fieldSelect || !fieldsReady()) return;
      const doc = loadFieldsDoc();
      const fields = SavedFields.listFields(doc);
      const activeId = doc.activeId || '';
      fieldSelect.innerHTML = '<option value="">No saved field</option>' + fields.map(f => {
        const acres = f.acres != null ? ` · ${f.acres} ac` : '';
        return `<option value="${escapeHtml(f.id)}">${escapeHtml(f.name)}${escapeHtml(acres)}</option>`;
      }).join('');
      fieldSelect.value = fields.some(f => f.id === activeId) ? activeId : '';
      if (fieldsToggle) fieldsToggle.textContent = fieldButtonLabel(SavedFields.resolveActive(doc));
    }

    function applyField(field, opts) {
      if (!field) return;
      currentLat = field.lat;
      currentLon = field.lon;
      map.setView([currentLat, currentLon], 9);
      centerMarker.setLatLng([currentLat, currentLon]);
      if (opts && opts.fetch !== false) fetchGridData();
    }

    function startFromUrlOrSavedOrGeo() {
      const fromUrl = typeof UrlLocation !== 'undefined' ? UrlLocation.fromSearch(window.location.search) : null;
      if (fromUrl) {
        currentLat = fromUrl.lat;
        currentLon = fromUrl.lon;
        map.setView([currentLat, currentLon], 9);
        centerMarker.setLatLng([currentLat, currentLon]);
        const searchInput = document.getElementById('location-search-input');
        if (fromUrl.name && searchInput) searchInput.value = fromUrl.name;
        fetchGridData();
        return;
      }
      const active = fieldsReady() ? SavedFields.resolveActive(loadFieldsDoc()) : null;
      if (active) {
        applyField(active, { fetch: true });
        return;
      }
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLon = pos.coords.longitude;
            centerMarker.setLatLng([currentLat, currentLon]);
            fetchGridData();
          },
          () => {
            console.log("Geolocation error or denied, using default location.");
            fetchGridData();
          },
          { timeout: 5000 }
        );
      } else {
        fetchGridData();
      }
    }

    refreshFieldsUi();
    startFromUrlOrSavedOrGeo();

    if (fieldsToggle && fieldsPanel) {
      fieldsToggle.addEventListener('click', () => {
        fieldsPanel.hidden = !fieldsPanel.hidden;
      });
    }

    if (fieldSelect) {
      fieldSelect.addEventListener('change', () => {
        const id = fieldSelect.value;
        if (!fieldsReady()) return;
        SavedFields.setActive(fieldsStorage(), id || null);
        refreshFieldsUi();
        const active = SavedFields.resolveActive(loadFieldsDoc());
        if (active) applyField(active, { fetch: true });
      });
    }

    if (fieldSaveBtn) {
      fieldSaveBtn.addEventListener('click', () => {
        if (!fieldsReady()) return;
        try {
          SavedFields.upsertField(fieldsStorage(), {
            name: fieldNameInput ? fieldNameInput.value : '',
            lat: currentLat,
            lon: currentLon,
            acres: fieldAcresInput ? fieldAcresInput.value : null
          });
          if (fieldNameInput) fieldNameInput.value = '';
          if (fieldAcresInput) fieldAcresInput.value = '';
          refreshFieldsUi();
        } catch (err) {
          alert(err.message || 'Could not save field.');
        }
      });
    }

    if (fieldRenameBtn) {
      fieldRenameBtn.addEventListener('click', () => {
        if (!fieldsReady()) return;
        const active = SavedFields.resolveActive(loadFieldsDoc());
        if (!active) {
          alert('Pick a saved field first.');
          return;
        }
        const next = window.prompt('Rename field', active.name);
        if (next == null) return;
        try {
          SavedFields.renameField(fieldsStorage(), active.id, next);
          refreshFieldsUi();
        } catch (err) {
          alert(err.message || 'Could not rename field.');
        }
      });
    }

    if (fieldDeleteBtn) {
      fieldDeleteBtn.addEventListener('click', () => {
        if (!fieldsReady()) return;
        const active = SavedFields.resolveActive(loadFieldsDoc());
        if (!active) {
          alert('Pick a saved field first.');
          return;
        }
        if (!window.confirm(`Delete ${active.name}?`)) return;
        SavedFields.deleteField(fieldsStorage(), active.id);
        refreshFieldsUi();
      });
    }

    window.searchAtLocation = function(lat, lon) {
      currentLat = lat;
      currentLon = lon;
      map.setView([lat, lon], 9);
      centerMarker.setLatLng([lat, lon]);
      map.closePopup();
      fetchGridData();
    };

    const locationSearchInput = document.getElementById('location-search-input');
    const locationSearchBtn = document.getElementById('location-search-btn');

    async function performLocationSearch() {
      const query = locationSearchInput.value.trim();
      if (!query) return;

      loadingEl.style.display = 'flex';
      try {
        // Simple coordinate check (e.g. "42.35, -97.79")
        const coordsMatch = query.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
        if (coordsMatch) {
          currentLat = parseFloat(coordsMatch[1]);
          currentLon = parseFloat(coordsMatch[3]);
          map.setView([currentLat, currentLon], 9);
          centerMarker.setLatLng([currentLat, currentLon]);
          fetchGridData();
          return;
        }

        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`, {
          headers: {
            'User-Agent': 'HeroWeatherApp/1.0'
          }
        });
        const data = await res.json();

        if (data && data.length > 0) {
          currentLat = parseFloat(data[0].lat);
          currentLon = parseFloat(data[0].lon);
          map.setView([currentLat, currentLon], 9);
          centerMarker.setLatLng([currentLat, currentLon]);
          fetchGridData();
        } else {
          alert('Location not found. Try a different search term.');
          loadingEl.style.display = 'none';
        }
      } catch (err) {
        console.error('Geocoding error:', err);
        alert('Failed to search location.');
        loadingEl.style.display = 'none';
      }
    }

    locationSearchBtn.addEventListener('click', performLocationSearch);
    locationSearchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        performLocationSearch();
      }
    });

    productSelect.addEventListener('change', fetchGridData);

    async function fetchGridData() {
      loadingEl.style.display = 'flex';

      const radius = 30; // Hardcoded to 30 miles
      const product = productSelect.value;

      try {
        const res = await fetch(`/api/spray-map.js?lat=${currentLat}&lon=${currentLon}&radius=${radius}&product=${encodeURIComponent(product)}`);

        if (!res.ok) {
          throw new Error('Network response was not ok');
        }

        gridData = await res.json();

        if (gridData && gridData.points && gridData.points.length > 0) {
          rectangles.forEach(rect => map.removeLayer(rect)); rectangles = [];
          currentHourIndex = 0;
          currentDayIndex = 0;
          renderSprayWindow({ reset: true });
        }
      } catch (err) {
        console.error("Failed to fetch grid data:", err);
        alert("Failed to load map data. Please try again.");
      } finally {
        loadingEl.style.display = 'none';
      }
    }

    function getColorForStatus(status) {
      if (status === 'favorable') return 'rgba(61,220,132,0.4)';
      if (status === 'caution') return 'rgba(255,193,7,0.4)';
      if (status === 'no-good') return 'rgba(255,77,77,0.4)';
      return 'transparent';
    }

    function getBorderColorForStatus(status) {
      if (status === 'favorable') return '#3ddc84';
      if (status === 'caution') return '#ffc107';
      if (status === 'no-good') return '#ff4d4d';
      return 'transparent';
    }


    const sprayBarTrack = document.getElementById('spray-bar-track');
    const sprayBarWrap = document.getElementById('spray-bar-wrap');

    const DAYS_OF_WEEK = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    function centerPointIndex() {
      if (!gridData || !gridData.points) return 0;
      const totalPoints = gridData.points.length;
      const gridSize = Math.round(Math.sqrt(totalPoints));
      if (gridSize * gridSize === totalPoints) {
        const centerRow = Math.floor(gridSize / 2);
        const centerCol = Math.floor(gridSize / 2);
        return centerRow * gridSize + centerCol;
      }
      return 0;
    }

    function getCenterPoint() {
      if (!gridData || !gridData.points || !gridData.points.length) return null;
      return gridData.points[centerPointIndex()];
    }

    function parseLocalDate(timeStr) {
      const s = String(timeStr || '');
      const iso = s.length === 10 ? `${s}T12:00` : s;
      const parts = (typeof SunTimes !== 'undefined') ? SunTimes.parseOpenMeteoLocal(iso) : null;
      if (parts) {
        // Encode the spot's wall clock as UTC components so getUTCHours()
        // returns the field hour, not the phone's hour.
        return new Date(Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second || 0));
      }
      return new Date(s.replace('T', ' '));
    }

    function formatDayLabel(timeOrDate) {
      const dt = parseLocalDate(timeOrDate);
      return `${DAYS_OF_WEEK[dt.getUTCDay()]} ${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
    }

    function statusLabel(status) {
      if (status === 'favorable') return 'Go';
      if (status === 'caution') return 'Caution';
      return 'No-Go';
    }

    function classifyDeltaTClient(dtC) {
      if (dtC == null || !Number.isFinite(Number(dtC))) {
        return { band: 'unknown', label: '—', className: 'dt-unknown' };
      }
      const dt = Number(dtC);
      if (dt < 2) return { band: 'too-low', label: 'Too low', className: 'dt-bad' };
      if (dt <= 8) return { band: 'ideal', label: 'Ideal', className: 'dt-optimal' };
      if (dt <= 10) return { band: 'marginal', label: 'Marginal', className: 'dt-caution' };
      return { band: 'too-dry', label: 'Too dry', className: 'dt-bad' };
    }

    function deltaTInfo(slot) {
      if (!slot) return classifyDeltaTClient(null);
      if (slot.deltaTLabel && slot.deltaTBand) {
        const fromBand = slot.deltaTBand === 'too-low' || slot.deltaTBand === 'too-dry'
          ? 'dt-bad'
          : slot.deltaTBand === 'marginal'
            ? 'dt-caution'
            : slot.deltaTBand === 'ideal'
              ? 'dt-optimal'
              : 'dt-unknown';
        return { band: slot.deltaTBand, label: slot.deltaTLabel, className: fromBand, value: slot.deltaT };
      }
      const info = classifyDeltaTClient(slot.deltaT);
      info.value = slot.deltaT;
      return info;
    }

    function formatDeltaTLine(slot) {
      const info = deltaTInfo(slot);
      if (info.value == null || !Number.isFinite(Number(info.value))) {
        return `<span class="dt-line dt-unknown">ΔT —</span>`;
      }
      const value = Number(info.value).toFixed(1);
      return `<span class="dt-line ${info.className}">ΔT ${value}°C · ${info.label}</span>`;
    }

    function windLimitsFromGrid() {
      if (gridData && gridData.windLimits) return gridData.windLimits;
      return null;
    }

    function describedWind(slot) {
      if (!slot) {
        return { windDir: 'N/A', arrowDeg: null, driftBand: 'unknown', driftNote: 'Wind data unavailable', wind: null, gust: null };
      }
      if (typeof WindDisplay !== 'undefined') {
        const shown = WindDisplay.describeWind(slot.wind, slot.gust, slot.windDirDeg, windLimitsFromGrid());
        if (slot.windDir && shown.windDir === 'N/A') shown.windDir = slot.windDir;
        if (slot.driftNote) {
          shown.driftBand = slot.driftBand || shown.driftBand;
          shown.driftNote = slot.driftNote;
        }
        return shown;
      }
      return {
        wind: slot.wind,
        gust: slot.gust,
        windDir: slot.windDir || 'N/A',
        arrowDeg: Number.isFinite(Number(slot.windDirDeg)) ? Number(slot.windDirDeg) : null,
        driftBand: slot.driftBand || 'unknown',
        driftNote: slot.driftNote || ''
      };
    }

    function driftClass(band) {
      if (band === 'over-limit') return 'drift-over';
      if (band === 'approaching') return 'drift-watch';
      if (band === 'within') return 'drift-ok';
      return 'drift-unknown';
    }

    function formatWindArrow(deg) {
      if (!Number.isFinite(Number(deg))) return '';
      return `<span class="wind-dir-arrow" style="transform:rotate(${Number(deg)}deg)">↑</span>`;
    }

    function formatWindLine(slot) {
      const w = describedWind(slot);
      const wind = w.wind == null ? '—' : w.wind;
      const gust = w.gust == null ? '—' : w.gust;
      const compass = w.windDir && w.windDir !== 'N/A' ? w.windDir : '—';
      return `<span class="wind-line">💨 ${wind} mph ${formatWindArrow(w.arrowDeg)} ${compass} · Gust ${gust}</span>`;
    }

    function formatDriftLine(slot) {
      const w = describedWind(slot);
      if (!w.driftNote) return '';
      return `<span class="${driftClass(w.driftBand)}">${escapeHtml(w.driftNote)}</span>`;
    }

    function formatSunLine(slot) {
      if (!slot) return '';
      const rise = slot.sunriseLabel || (typeof SunTimes !== 'undefined' ? SunTimes.formatSunTime(slot.sunrise) : null);
      const set = slot.sunsetLabel || (typeof SunTimes !== 'undefined' ? SunTimes.formatSunTime(slot.sunset) : null);
      if (!rise && !set) return '<span class="sun-line">Sunrise/sunset —</span>';
      return `<span class="sun-line">🌅 ${escapeHtml(rise || '—')} · 🌇 ${escapeHtml(set || '—')}</span>`;
    }

    function formatSunShort(slot) {
      if (!slot) return '';
      const rise = (typeof SunTimes !== 'undefined' && slot.sunrise)
        ? SunTimes.formatSunTimeShort(slot.sunrise)
        : (slot.sunriseLabel || null);
      const set = (typeof SunTimes !== 'undefined' && slot.sunset)
        ? SunTimes.formatSunTimeShort(slot.sunset)
        : (slot.sunsetLabel || null);
      if (!rise && !set) return '';
      return `${rise || '—'} · ${set || '—'}`;
    }

    function sunEventMark(slot) {
      if (!slot || !slot.sunEvent) return '';
      if (slot.sunEvent === 'sunrise') return '<span class="sun-mark">☀</span>';
      if (slot.sunEvent === 'sunset') return '<span class="sun-mark">☾</span>';
      return '';
    }

    function hourlySegmentClass(slot) {
      const classes = [];
      if (slot && slot.daylight === false) classes.push('night');
      if (slot && slot.sunEvent === 'sunrise') classes.push('sunrise-hour');
      if (slot && slot.sunEvent === 'sunset') classes.push('sunset-hour');
      return classes.length ? ' ' + classes.join(' ') : '';
    }

    function renderSprayWindow(opts) {
      if (!gridData || !gridData.points || gridData.points.length === 0) return;

      const center = getCenterPoint();
      if (!center) return;

      const hours = center.hourly || [];
      const days = center.daily || [];
      let htmlOutput = '';

      if (viewMode === 'daily') {
        days.forEach((day, i) => {
          const dt = parseLocalDate(`${day.date}T12:00`);
          const dow = DAYS_OF_WEEK[dt.getUTCDay()];
          const dateLabel = `${MONTHS[dt.getUTCMonth()]} ${dt.getUTCDate()}`;
          const low = !!day.lowerConfidence;
          if (low && (i === 0 || !days[i - 1].lowerConfidence)) {
            htmlOutput += `<div class="confidence-break">Trend<br>only</div>`;
          }
          const sunShort = formatSunShort(day);
          htmlOutput += `<div class="spray-segment daily-segment${low ? ' lower-confidence' : ''}" data-index="${i}">
            <div class="spray-block ${day.status}" title="${(day.reasons || []).join(', ')}"></div>
            <div class="spray-time bold">${dow}</div>
            <div class="spray-time">${dateLabel}</div>
            ${sunShort ? `<div class="daily-sun">${escapeHtml(sunShort)}</div>` : ''}
            ${low ? '<div class="trend-mark">trend</div>' : ''}
          </div>`;
        });
      } else {
        let currentDayString = '';
        hours.forEach((h, i) => {
          const dt = parseLocalDate(h.time);
          const hr = dt.getUTCHours();
          const hr12 = hr % 12 || 12;
          const ampm = hr < 12 ? 'a' : 'p';
          const bold = hr === 0 || hr === 6 || hr === 12 || hr === 18;
          const dayStr = formatDayLabel(h.time);

          if (i === 0 || (currentDayString !== '' && currentDayString !== dayStr)) {
            if (i !== 0) htmlOutput += `<div class="midnight-divider"></div>`;
            htmlOutput += `<div class="day-label">${dayStr}</div>`;
            currentDayString = dayStr;
          }

          htmlOutput += `<div class="spray-segment${hourlySegmentClass(h)}" data-index="${i}">
            <div class="spray-block ${h.status}" title="${(h.reasons || []).join(', ')}">${sunEventMark(h)}</div>
            <div class="spray-time ${bold ? 'bold' : ''}">${hr12}${ampm}</div>
          </div>`;
        });
      }

      sprayBarTrack.innerHTML = htmlOutput;

      sprayBarTrack.querySelectorAll('.spray-segment').forEach(seg => {
        seg.addEventListener('click', () => {
          const idx = parseInt(seg.getAttribute('data-index'), 10);
          syncToIndex(idx);
        });
      });

      const maxIdx = viewMode === 'daily' ? Math.max(0, days.length - 1) : Math.max(0, hours.length - 1);
      const startIdx = opts && opts.reset ? 0 : (viewMode === 'daily' ? currentDayIndex : currentHourIndex);
      syncToIndex(Math.min(Math.max(0, startIdx), maxIdx));
    }

    function updateSelectionDetails() {
      if (!selectionDetails) return;
      const center = getCenterPoint();
      if (!center) {
        selectionDetails.innerHTML = '';
        return;
      }

      if (viewMode === 'daily') {
        const day = (center.daily || [])[currentDayIndex];
        if (!day) {
          selectionDetails.innerHTML = '';
          return;
        }
        const goList = (day.goHours || []).map(h => h.label).join(', ') || 'none';
        const windowText = day.bestWindow
          ? `${day.bestWindow.startLabel}–${day.bestWindow.endLabel} (${day.bestWindow.hours}h ${statusLabel(day.bestWindow.status)})`
          : 'none';
        const reasonText = (day.reasons && day.reasons.length)
          ? day.reasons.slice(0, 2).join(' · ')
          : 'All daytime params within label limits';
        const confidenceNote = day.lowerConfidence
          ? ' · Lower confidence — trend guidance, not a reliable go/no-go'
          : '';
        selectionDetails.innerHTML =
          `<strong>${formatDayLabel(day.date)}</strong> · ${statusLabel(day.status)}` +
          ` · Best window: ${windowText}` +
          ` · Worst: ${statusLabel(day.worstStatus)}` +
          ` · Go hours: ${goList}` +
          ` · ${formatSunLine(day)}` +
          ` · ${formatDeltaTLine(day)}` +
          `${confidenceNote}` +
          `<br>${formatWindLine(day)} · ${formatDriftLine(day)}` +
          `<br>${reasonText}`;
        return;
      }

      const hour = (center.hourly || [])[currentHourIndex];
      if (!hour) {
        selectionDetails.innerHTML = '';
        return;
      }
      const dt = parseLocalDate(hour.time);
      const hr12 = dt.getUTCHours() % 12 || 12;
      const ampm = dt.getUTCHours() < 12 ? 'a' : 'p';
      const reasonText = (hour.reasons && hour.reasons.length)
        ? hour.reasons.slice(0, 2).join(' · ')
        : 'All parameters within label limits';
      selectionDetails.innerHTML =
        `<strong>${formatDayLabel(hour.time)} ${hr12}${ampm}</strong> · ${statusLabel(hour.status)}` +
        ` · ${hour.temp}°F · ${formatWindLine(hour)}` +
        ` · ${formatDeltaTLine(hour)}` +
        `<br>${formatDriftLine(hour)}` +
        `<br>${reasonText}`;
    }

    function syncToIndex(idx) {
      if (!gridData || !gridData.points) return;
      if (viewMode === 'daily') currentDayIndex = idx;
      else currentHourIndex = idx;

      sprayBarTrack.querySelectorAll('.spray-segment').forEach((el, i) => {
        el.classList.toggle('active-segment', i === idx);
      });

      const activeEl = sprayBarTrack.querySelectorAll('.spray-segment')[idx];
      if (activeEl && sprayBarWrap) {
        const wrapCenter = sprayBarWrap.clientWidth / 2;
        const elCenter = activeEl.offsetLeft + (activeEl.offsetWidth / 2);
        sprayBarWrap.scrollTo({ left: elCenter - wrapCenter, behavior: 'smooth' });
      }

      updateSelectionDetails();
      updateGridOverlay();
    }

    function generateHourlyPopupContent(point, hourData) {
      const reasons = hourData.reasons && hourData.reasons.length > 0
                    ? `<div style="margin-top:6px;font-size:11px;color:#ffaaaa;">${hourData.reasons.join('<br>')}</div>`
                    : `<div style="margin-top:6px;font-size:11px;color:#aaffaa;">All parameters within label limits</div>`;

      return `
        <div class="popup-content">
          <div class="popup-title">Location: ${point.lat}, ${point.lon}</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="popup-status status-${hourData.status}" style="margin: 0;">Status: ${statusLabel(hourData.status)}</div>
            <button class="search-here-btn" onclick="searchAtLocation(${point.lat}, ${point.lon})">Search Here</button>
          </div>
          <div style="margin-top: 5px;">🌡️ Temp: ${hourData.temp}°F</div>
          <div>${formatWindLine(hourData)}</div>
          <div>${formatDriftLine(hourData)}</div>
          <div>💧 RH: ${hourData.rh}%</div>
          <div>🌧️ Precip: ${hourData.precip}%</div>
          <div>${formatDeltaTLine(hourData)}</div>
          ${reasons}
        </div>
      `;
    }

    function generateDailyPopupContent(point, day) {
      const goList = (day.goHours || []).map(h => h.label).join(', ') || 'none';
      const windowText = day.bestWindow
        ? `${day.bestWindow.startLabel}–${day.bestWindow.endLabel} (${day.bestWindow.hours}h ${statusLabel(day.bestWindow.status)})`
        : 'none';
      const reasons = day.reasons && day.reasons.length > 0
                    ? `<div style="margin-top:6px;font-size:11px;color:#ffaaaa;">${day.reasons.join('<br>')}</div>`
                    : `<div style="margin-top:6px;font-size:11px;color:#aaffaa;">All daytime params within label limits</div>`;
      const tempLine = (day.tempMin != null && day.tempMax != null)
        ? `${day.tempMin}–${day.tempMax}°F`
        : (day.temp != null ? `${day.temp}°F` : '—');

      return `
        <div class="popup-content">
          <div class="popup-title">${formatDayLabel(day.date)} · ${point.lat}, ${point.lon}</div>
          <div style="display: flex; align-items: center; gap: 8px;">
            <div class="popup-status status-${day.status}" style="margin: 0;">Day: ${statusLabel(day.status)}</div>
            <button class="search-here-btn" onclick="searchAtLocation(${point.lat}, ${point.lon})">Search Here</button>
          </div>
          ${day.lowerConfidence ? '<div style="margin-top:5px;font-size:11px;color:#ffc107;">Lower confidence — trend guidance past ~7 days, not a reliable go/no-go</div>' : ''}
          <div style="margin-top: 5px;">Worst hour: ${statusLabel(day.worstStatus)}</div>
          <div>Best window: ${windowText}</div>
          <div>Go hours: ${goList}</div>
          <div>🌡️ Temp: ${tempLine}</div>
          <div>${formatSunLine(day)}</div>
          <div>${formatWindLine(day)}</div>
          <div>${formatDriftLine(day)}</div>
          <div>💧 RH: ${day.rh != null ? day.rh : '—'}%</div>
          <div>🌧️ Precip: ${day.precip != null ? day.precip : '—'}%</div>
          <div>${formatDeltaTLine(day)}</div>
          ${reasons}
        </div>
      `;
    }

    function selectedSlot(point) {
      if (viewMode === 'daily') return (point.daily || [])[currentDayIndex];
      return (point.hourly || [])[currentHourIndex];
    }

    function generatePopupContent(point, slot) {
      if (viewMode === 'daily') return generateDailyPopupContent(point, slot);
      return generateHourlyPopupContent(point, slot);
    }

    function updateGridOverlay() {
      if (!gridData || !gridData.points) return;

      const isFirstRender = rectangles.length === 0;

      gridData.points.forEach((point, idx) => {
        const slot = selectedSlot(point);
        if (!slot) return;

        const status = slot.status;
        const color = getColorForStatus(status);
        const borderColor = getBorderColorForStatus(status);
        const fillOpacity = (viewMode === 'daily' && slot.lowerConfidence) ? 0.55 : 1;

        if (isFirstRender) {
          const rect = L.rectangle(point.bounds, {
            color: borderColor,
            weight: 1,
            fillColor: color,
            fillOpacity
          }).addTo(map);

          rect.bindPopup(() => generatePopupContent(point, selectedSlot(point)));
          rectangles.push(rect);
        } else {
          const rect = rectangles[idx];
          rect.setStyle({ fillColor: color, color: borderColor, fillOpacity });
          rect.getPopup().setContent(generatePopupContent(point, slot));
        }
      });
    }

    function setViewMode(nextView) {
      if (nextView !== 'hourly' && nextView !== 'daily') return;
      const center = getCenterPoint();
      if (nextView !== viewMode && center) {
        if (nextView === 'daily') {
          const hour = (center.hourly || [])[currentHourIndex];
          const date = hour && hour.time ? hour.time.slice(0, 10) : null;
          const idx = (center.daily || []).findIndex(d => d.date === date);
          currentDayIndex = idx >= 0 ? idx : 0;
        } else {
          const day = (center.daily || [])[currentDayIndex];
          const date = day && day.date;
          const idx = (center.hourly || []).findIndex(h => String(h.time).startsWith(date));
          currentHourIndex = idx >= 0 ? idx : 0;
        }
      }
      viewMode = nextView;
      if (viewTabs) {
        viewTabs.querySelectorAll('.sw-tab').forEach(tab => {
          tab.classList.toggle('active', tab.getAttribute('data-view') === viewMode);
        });
      }
      if (viewLegend) viewLegend.textContent = VIEW_LEGENDS[viewMode];
      renderSprayWindow();
    }

    if (viewTabs) {
      viewTabs.addEventListener('click', (e) => {
        const tab = e.target.closest('.sw-tab');
        if (!tab) return;
        setViewMode(tab.getAttribute('data-view'));
      });
    }



    const playPauseBtn = document.getElementById('play-pause');
    let playInterval = null;

    const playbackSpeedSelect = document.getElementById('playback-speed');

    function currentMaxIndex() {
      const center = getCenterPoint() || (gridData && gridData.points && gridData.points[0]);
      if (!center) return 0;
      if (viewMode === 'daily') return Math.max(0, (center.daily || []).length - 1);
      return Math.max(0, (center.hourly || []).length - 1);
    }

    function startPlayback() {
      if (playInterval) clearInterval(playInterval);
      const intervalMs = parseInt(playbackSpeedSelect.value, 10) || 1000;
      playInterval = setInterval(() => {
        if (!gridData || !gridData.points) return;
        const maxIdx = currentMaxIndex();
        const current = viewMode === 'daily' ? currentDayIndex : currentHourIndex;
        let nextIdx = current + 1;
        if (nextIdx > maxIdx) {
          nextIdx = 0; // loop back to start
        }
        syncToIndex(nextIdx);
      }, intervalMs);
    }

    if (playPauseBtn) {
      playPauseBtn.addEventListener('click', () => {
        if (playInterval) {
          clearInterval(playInterval);
          playInterval = null;
          playPauseBtn.textContent = '▶';
        } else {
          playPauseBtn.textContent = '⏸';
          startPlayback();
        }
      });
    }

    if (playbackSpeedSelect) {
      playbackSpeedSelect.addEventListener('change', () => {
        if (playInterval) {
          startPlayback(); // restart with new speed
        }
      });
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(() => {});
    }

  </script>
</body></html>
